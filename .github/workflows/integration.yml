name: 🧨 Fireworks Integration Tests

on:
  # 1️⃣ Déclenche automatiquement après le workflow CI
  workflow_run:
    workflows: [ "Rust CI with Coverage" ] # remplace par le nom exact de ton workflow de build
    types:
    - completed
  # 2️⃣ Déclenche manuellement depuis GitHub Actions
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *' # tous les jours à minuit

jobs:
  integration-test:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout du code source
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.ref }}

    # 🚀 Installation de Taskfile
    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.50.0
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # 2️⃣ Setup Docker buildx (pour cache efficace)
    - name: 🧱 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4️⃣ Build Docker image with inline cache ---
    - name: 🔨 Build Docker image (with cache)
      run: task ci:build-docker-integration

    # 5️⃣ Exécution du test d’intégration
    - name: 🚀 Run integration test
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: task ci:run-integration

    # 5️⃣ Setup Python + cache UV (gestionnaire de dépendances)
    - name: 🧩 Setup Python environment
      run: |
        pip install uv

    - name: ♻️ Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    # 6️⃣ Run Fireworks Analysis (post-processing)
    - name: 📊 Run Fireworks Analysis
      run: task ci:analyze-fireworks

    # 6️⃣ Upload des artifacts de sortie (logs, screenshots, audio…)
    - name: 📦 Upload output artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fireworks-output
        path: output/
        retention-days: 7