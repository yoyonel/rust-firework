name: Build & Push Golden CI Image

on:
  push:
    paths:
      - '.github/docker/Dockerfile.ci'
      - '.github/workflows/ci-docker-image.yml'
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-ci-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-ci
          tags: |
            type=sha,prefix=sha-,format=short
            type=schedule,pattern=weekly
            type=raw,value=latest

      - name: Build and push Docker Golden Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy OS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}-ci:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
