name: Preview mdBook Documentation (Surge.sh)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "doc/**"
      - "book.toml"
      - ".github/workflows/preview_docs.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Build & Deploy mdBook Surge Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.40"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Build mdBook Documentation
        run: mdbook build

      - name: Deploy Surge PR Preview & Comment
        uses: afc163/surge-preview@v1
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          build: echo "skip build"
          dist: ./book
          teardown: false
