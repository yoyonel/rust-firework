name: Rust CI/CD (DevSecOps DAG)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # JOB 1: Fast-Fail Preflight (Lint & Security Scan)
  # ============================================================================
  lint-and-security:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yoyonel/rust-firework-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          show-progress: false
          sparse-checkout: |
            .github
            assets
            benches
            doc
            scripts
            src
            tests/goldens
            Cargo.toml
            Cargo.lock
            Taskfile.yml
            deny.toml

      - name: Strip local patches in CI
        run: sed -i '/\[patch.crates-io\]/,/tracy-client =/d' Cargo.toml

      - name: Run Linters (rustfmt, clippy, ruff, vale)
        run: task lint:all

      - name: Run DevSecOps Supply Chain Audit (cargo-deny)
        run: cargo deny check advisories licenses bans

  # ============================================================================
  # JOB 2: Unit Tests & Code Coverage (Parallel)
  # ============================================================================
  unit-tests-coverage:
    needs: lint-and-security
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yoyonel/rust-firework-ci:latest
      options: --user root
    env:
      DISPLAY: :99
      SCCACHE_DIR: /tmp/sccache_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          show-progress: false
          sparse-checkout: |
            .github
            assets
            benches
            doc
            scripts
            src
            tests
            Cargo.toml
            Cargo.lock
            Taskfile.yml
            deny.toml

      - name: Strip local patches in CI
        run: sed -i '/\[patch.crates-io\]/,/tracy-client =/d' Cargo.toml

      - name: Setup CI Cache
        uses: ./.github/actions/setup-ci-cache
        with:
          shared_key: "unit-cov"

      - name: Start sccache
        run: sccache --start-server

      - name: Run unit & integration tests with coverage
        run: task ci:coverage

      - name: Show sccache stats
        run: sccache --show-stats

  # ============================================================================
  # JOB 3: Mesa OpenGL & 120-Frame Visual Regression (Parallel)
  # ============================================================================
  mesa-visual-regression:
    needs: lint-and-security
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yoyonel/rust-firework-ci:latest
      options: --user root
    env:
      DISPLAY: :99
      SCCACHE_DIR: /tmp/sccache_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          show-progress: false
          sparse-checkout: |
            .github
            assets
            benches
            doc
            scripts
            src
            tests
            Cargo.toml
            Cargo.lock
            Taskfile.yml
            deny.toml

      - name: Strip local patches in CI
        run: sed -i '/\[patch.crates-io\]/,/tracy-client =/d' Cargo.toml

      - name: Setup CI Cache
        uses: ./.github/actions/setup-ci-cache
        with:
          shared_key: "visual-mesa"

      - name: Start sccache
        run: sccache --start-server

      - name: OpenGL Headless Spec Validation
        run: task test:opengl-mesa

      - name: Run Full 120-Frame Visual Non-Regression
        run: task test:visual-full

  # ============================================================================
  # JOB 4: RenderDoc GPU Capture & Validation (Parallel)
  # ============================================================================
  renderdoc-validation:
    needs: lint-and-security
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yoyonel/rust-firework-ci:latest
      options: --user root
    env:
      DISPLAY: :99
      SCCACHE_DIR: /tmp/sccache_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          show-progress: false
          sparse-checkout: |
            .github
            assets
            benches
            doc
            scripts
            src
            tests/goldens
            Cargo.toml
            Cargo.lock
            Taskfile.yml
            deny.toml

      - name: Strip local patches in CI
        run: sed -i '/\[patch.crates-io\]/,/tracy-client =/d' Cargo.toml

      - name: Setup CI Cache
        uses: ./.github/actions/setup-ci-cache
        with:
          shared_key: "renderdoc"

      - name: RenderDoc GPU Capture Execution
        run: task renderdoc:capture

  # ============================================================================
  # JOB 5: Tracy Profile Ratio Benchmark (PR Only, Parallel)
  # ============================================================================
  tracy-ratio-benchmark:
    needs: lint-and-security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yoyonel/rust-firework-ci:latest
      options: --user root
    env:
      DISPLAY: :99
      SCCACHE_DIR: /tmp/sccache_cache
      TRACY_CAPTURE_BIN: /usr/local/bin/tracy-capture
      TRACY_CSVEXPORT_BIN: /usr/local/bin/tracy-csvexport
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          show-progress: false
          sparse-checkout: |
            .github
            assets
            benches
            doc
            scripts
            src
            tests/goldens
            Cargo.toml
            Cargo.lock
            Taskfile.yml
            deny.toml

      - name: Strip local patches in CI
        run: sed -i '/\[patch.crates-io\]/,/tracy-client =/d' Cargo.toml

      - name: Setup CI Cache
        uses: ./.github/actions/setup-ci-cache
        with:
          shared_key: "tracy-bench"

      - name: Run Tracy Profile Ratio Benchmark
        run: xvfb-run -a task bench:tracy-ratios

      - name: Post Tracy Ratio Comment on PR
        if: always() && hashFiles('/tmp/tracy_pr_comment.md') != ''
        uses: mshick/add-pr-comment@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: tracy-ratio-benchmark
          message-path: /tmp/tracy_pr_comment.md

  # ============================================================================
  # JOB 6: Observability DX Aggregator & Native Step Summary
  # ============================================================================
  ci-summary-report:
    needs: [unit-tests-coverage, mesa-visual-regression, renderdoc-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate GHA Step Summary Dashboard
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 DevSecOps Pipeline Execution Dashboard

          ### 📊 Job Matrix Status

          | Job Name | Status | Target |
          | :--- | :--- | :--- |
          | **Fast-Fail Preflight** | 🟢 PASS | `task lint:all` & `cargo-deny` |
          | **Unit Tests & Coverage** | ${{ needs.unit-tests-coverage.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} | `task ci:coverage` |
          | **Mesa OpenGL & Visual 120-frame** | ${{ needs.mesa-visual-regression.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} | `task test:opengl-mesa` |
          | **RenderDoc GPU Capture** | ${{ needs.renderdoc-validation.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} | `task renderdoc:capture` |

          ---
          *Report generated automatically by DevSecOps Containerized CI/CD*
          EOF
