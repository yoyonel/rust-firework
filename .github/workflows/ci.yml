name: Rust CI with Coverage

on:
  push:
    # sur chaque push
    branches:
      - "**"
  pull_request:
    # sur chaque pull request
    branches:
      - master
      - develop
  workflow_dispatch: # permet le lancement manuellement du workflow
  schedule:
    - cron: "0 0 * * *" # tous les jours à minuit

jobs:
  build-and-test:
    # Ne s'exécute que si ce n'est pas un push vers une branche ayant une PR ouverte
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      DISPLAY: :99
      RUST_VERSION: 1.90.0
      RUSTC_WRAPPER: sccache
      CARGO_TERM_COLOR: always

    steps:
      # --- Étape 1 : Checkout du code ---
      - uses: actions/checkout@v4

      # --- Étape 2 : Préparer Cargo.toml pour la CI (retirer patch tracy-client local) ---
      - name: Strip local patches in CI
        run: sed -i '/\[patch.crates-io\]/,/tracy-client =/d' Cargo.toml

      # 🦀 2. Installation de Rust toolchain
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview

      # 🚀 Installation de Taskfile
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.50.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 🧰 Configuration centralisée du Cache Multi-Couches (Composite Action)
      - name: Setup Multi-Layer CI Cache
        uses: ./.github/actions/setup-ci-cache
        id: cache

      # --- Étape 3 : Installer les outils système ---
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libglu1-mesa-dev \
            libasound2-dev alsa-utils alsa-oss \
            pulseaudio pulseaudio-utils \
            libdbus-1-dev \
            xvfb xauth pkg-config make git ca-certificates curl \
            ffmpeg xdotool

      # --- Installation ultra rapide de sccache (binaire précompilé) ---
      - name: Install sccache (binary)
        run: |
          SCCACHE_VERSION="0.7.4"
          if ! command -v sccache &> /dev/null; then
            curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o sccache.tar.gz
            tar xzf sccache.tar.gz
            sudo mv sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/
          fi
          sccache --version
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> $GITHUB_ENV

      - name: SCCache start server
        run: sccache --start-server

      - name: Lint project
        run: |
          rustup component add rustfmt clippy
          python3 -m pip install --quiet ruff || true
          task lint

      # --- Étape 4 : Installer cargo-llvm-cov et LLVM tools ---
      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov &> /dev/null; then
            cargo install cargo-llvm-cov --locked
          else
            echo "cargo-llvm-cov already installed, skipping..."
          fi

      # --- Étape 5 : Build du projet ---
      - name: Build project
        run: |
          task build-release

      # --- Étape 6 : Lancer les tests avec coverage (3 Keyframes) ---
      - name: Run tests with coverage
        run: task ci:coverage

      # --- Étape 7 : Full 120-Frame Visual Non-Regression (Pre-Merge Master) ---
      - name: Run Full 120-Frame Visual Non-Regression (Pre-Merge Master)
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: task test-visual-full

      # --- Installation de RenderDoc CLI (si non présent en cache) ---
      - name: Install RenderDoc CLI
        if: steps.cache.outputs.cache-hit-renderdoc != 'true'
        run: |
          mkdir -p ~/.local/opt ~/.cargo/bin
          curl -sSL https://renderdoc.org/stable/1.45/renderdoc_1.45.tar.gz | tar -xz -C ~/.local/opt/
          ln -sf ~/.local/opt/renderdoc_1.45/bin/renderdoccmd ~/.cargo/bin/renderdoccmd
          renderdoccmd --version

      # --- Étape 8 : RenderDoc GPU Capture & OpenGL Spec Validation ---
      - name: RenderDoc GPU Capture & OpenGL Spec Validation
        run: |
          task renderdoc-capture

      # --- Étape 9 : Tracy CLI Tools Setup & Ratio Benchmark (PR Review) ---
      - name: Setup Tracy CLI Tools
        if: github.event_name == 'pull_request'
        run: |
          ./scripts/setup_tracy_tools.sh ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "TRACY_CAPTURE_BIN=$HOME/.local/bin/tracy-capture" >> $GITHUB_ENV
          echo "TRACY_CSVEXPORT_BIN=$HOME/.local/bin/tracy-csvexport" >> $GITHUB_ENV

      - name: Run Tracy Profile Ratio Benchmark
        if: github.event_name == 'pull_request'
        run: |
          xvfb-run -a task bench-tracy-ratios

      - name: Post Tracy Ratio Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('/tmp/tracy_pr_comment.md') != ''
        uses: mshick/add-pr-comment@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: tracy-ratio-benchmark
          message-path: /tmp/tracy_pr_comment.md

      - name: SCCache stop server
        run: |
          sccache --show-stats
          sccache --stop-server
