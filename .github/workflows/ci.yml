name: Quality Canvas CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - develop

jobs:
  quality-canvas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.38.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Environment
        run: task env:sync

      - name: Run Native Unit Tests
        run: task test:unit

      - name: Run Universal Visual Regression Pipeline
        run: task test:visual

      - name: Upload Visual Regression Heatmaps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-heatmaps
          path: tests/visual_baselines/artifacts/
