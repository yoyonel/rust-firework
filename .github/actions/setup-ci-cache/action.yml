name: "Setup Container CI Cache"
description: "Optimized caching for Cargo registry, Target artifacts, and Sccache inside Golden Image container"

inputs:
  shared_key:
    description: "Shared cache key prefix"
    required: false
    default: "rust-firework-ci"

runs:
  using: "composite"
  steps:
    - name: Cache Cargo registry & git
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache sccache compilation artifacts
      uses: actions/cache@v4
      with:
        path: /tmp/sccache_cache
        key: ${{ runner.os }}-sccache-${{ inputs.shared_key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-sccache-${{ inputs.shared_key }}-
          ${{ runner.os }}-sccache-
