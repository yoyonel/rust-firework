# https://doc.rust-lang.org/cargo/reference/config.html#configuration-format
[package]
edition = "2021"
name = "fireworks_sim"
version = "0.1.0"

[dependencies]
# Création fenêtre + gestion input
# last version using glfw2
glfw = "<=0.59.0"
# Liens OpenGL bas-niveau
gl = ">=0.14"

# Gestion des erreurs/logging
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"

bytemuck = { version = "1.24.0", features = ["derive"] }
cpal = "0.16"                                            # ou la dernière version
crossbeam = "0.8.4"
derive_builder = "0.20.2"
hound = "3.5"                                            # lecture WAV simple
lazy_static = "1.5.0"
memoffset = "0.9.1"
rand = "0.9.2"
regex = "1.12.2"
rustc_version_runtime = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
itertools = "0.14.0"
generational-arena = "0.2.9"
glam = "0.30.9"
crossbeam-channel = "0.5.15"
image = "0.25.8"
imgui = "0.12.0"
imgui-glfw-rs = "0.12.0"
fuzzy-matcher = "0.3.7"
copypasta = "0.10.2"

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3.8"

[features]
default = ["simd", "test_helpers"] # SIMD activé par défaut
fft = []
no_simd = []                       # Force le mode scalaire
simd = []                          # Active le code SIMD
test_helpers = []
interactive_tests = []

# =======================================================
# ⚙️ PROFILS DE COMPILATION
# https://doc.rust-lang.org/cargo/reference/profiles.html
# =======================================================

# 1. DEVELOPPEMENT (Défaut lors de `cargo build` / `cargo run`)
[profile.dev]
opt-level = 0
debug = true
strip = false

# 2. RELEASE STANDARD (Bon compromis vitesse d'exécution / temps de compilation)
[profile.release]
opt-level = 3
lto = "thin"         # LTO léger : optimise bien sans prendre des heures
strip = true         # Supprime les symboles (réduit la taille de 90%)
panic = "unwind"     # Garde le déroulement de pile par défaut

# 3. PROFILING (Hérite de Release, mais garde les symboles pour l'analyse)
[profile.profiling]
inherits = "release"
debug = true         # Inclut les symboles de debug
strip = false        # Ne strip PAS les symboles (vital pour cargo bloat/valgrind)
split-debuginfo = 'packed' 

# 4. ULTRA-SPEED (FPS Maximum pour la simulation de feux d'artifice)
[profile.ultra-speed]
inherits = "release"
lto = "fat"          # Optimisation complète inter-crates (Compilation lente)
codegen-units = 1    # Force un seul bloc pour un inlining parfait
panic = "abort"      # Retire l'unwinding pour soulager le cache L1

# 5. ULTRA-SIZE (Taille de binaire minimale absolue)
[profile.ultra-size]
inherits = "release"
opt-level = "z"      # Optimise agressivement pour la taille
lto = "fat"
codegen-units = 1
panic = "abort"