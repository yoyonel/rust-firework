# ==========================================
# Configuration prek.toml pour la qualité 
# globale du projet Rust
# ==========================================

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.28.1"

  # Garde la vérification de votre Taskfile
  [[repos.hooks]]
  id = "check-jsonschema"
  name = "Check Taskfile.yml syntax"
  files = "^Taskfile\\.yml$"
  types = ["yaml"]
  args = ["--schemafile", "https://taskfile.dev/schema.json"]


# ==========================================
# Outils natifs de l'écosystème Rust
# ==========================================
[[repos]]
repo = "local"
  
  # 1. Vérification du formatage (cargo fmt)
  # S'assure que tout le code respecte le style standard Rust
  [[repos.hooks]]
  id = "cargo-fmt"
  name = "Rust Format (cargo fmt)"
  entry = "cargo fmt --all -- --check"
  language = "system"
  types = ["rust"]
  pass_filenames = false

  # 2. Analyse statique stricte (cargo clippy)
  # Bloque le commit s'il y a des avertissements.
  # Note: --all-features a été retiré car simd et no_simd sont mutuellement exclusifs.
  [[repos.hooks]]
  id = "cargo-clippy"
  name = "Rust Clippy"
  entry = "cargo clippy --all-targets -- -D warnings"
  language = "system"
  types = ["rust"]
  pass_filenames = false

  # 3. Vérification des dépendances inutilisées (cargo shear)
  # Puisque vous avez déjà cette cible dans votre Taskfile, on l'automatise !
  [[repos.hooks]]
  id = "cargo-shear"
  name = "Check Unused Dependencies (cargo shear)"
  entry = "cargo shear"
  language = "system"
  types = ["rust", "toml"]
  pass_filenames = false