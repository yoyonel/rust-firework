version: '3'

vars:
  PROJECT_NAME: 'rust-firework'
  CONTAINER_IMAGE: 'canvas-env:latest'
  CONTAINER_NAME: 'canvas-dev-env'
  DISTROBOX_NAME: 'canvas-box'

env:
  IN_CONTAINER:
    sh: '[ -f /.dockerenv ] || [ -n "$DISTROBOX_ENTERED" ] && echo "true" || echo "false"'

tasks:
  env:sync:
    desc: "Build & sync local container/Distrobox dev environment"
    cmds:
      - |
        if command -v distrobox >/dev/null 2>&1; then
          distrobox create --name {{.DISTROBOX_NAME}} --image {{.CONTAINER_IMAGE}} --file env/Dockerfile.env --replace
        else
          docker build -t {{.CONTAINER_IMAGE}} -f env/Dockerfile.env .
        fi

  build:dev:
    desc: "Build dev binary with debug symbols & runtime checks"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task build:dev
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task build:dev
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[BUILD:DEV] Executing target build for {{.PROJECT_NAME}}"
          cargo build
        fi

  build:release:
    desc: "Build fully optimized release binary"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task build:release
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task build:release
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[BUILD:RELEASE] Executing LTO/Release target build"
          cargo build --release
        fi

  build:sanitized:
    desc: "Build with AddressSanitizer (ASan) & UBSan"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task build:sanitized
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task build:sanitized
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[BUILD:SANITIZED] Building with ASan/UBSan instrumentation"
          RUSTFLAGS="-Zsanitizer=address" cargo build
        fi

  check:format:
    desc: "Check formatting across all code and meta-files"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task check:format
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task check:format
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[CHECK:FORMAT] Running clang-format / rustfmt / odin fmt / prettier"
          cargo fmt --check
        fi

  check:lint:
    desc: "Run static analysis and linters"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task check:lint
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task check:lint
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[CHECK:LINT] Running clang-tidy / clippy / odin check / hadolint / actionlint"
          cargo clippy -- -D warnings
        fi

  test:unit:
    desc: "Execute native unit test suite"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task test:unit
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task test:unit
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "Running unit tests natively..."
          chmod +x scripts/run_unit_tests.sh
          ./scripts/run_unit_tests.sh
        fi

  test:visual:
    desc: "Execute headless visual regression tests under Xvfb"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task test:visual
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task test:visual
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[TEST:VISUAL] Running engine tests with interactive_tests feature..."
          xvfb-run -a cargo test --features "interactive_tests"
          echo "[TEST:VISUAL] Evaluating MSE visual baselines..."
          chmod +x scripts/verify_baselines.py
          python3 scripts/verify_baselines.py
        fi

  test:chaos:
    desc: "Execute stress & chaos testing"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task test:chaos
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task test:chaos
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[TEST:CHAOS] Running chaos input/state stress scenarios"
        fi

  profile:mem:
    desc: "Profile memory allocation with Heaptrack & Valgrind"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task profile:mem
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task profile:mem
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[PROFILE:MEM] Running Heaptrack / Valgrind Memcheck"
        fi

  profile:cpu:
    desc: "Profile CPU execution with Tracy / perf"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task profile:cpu
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task profile:cpu
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[PROFILE:CPU] Collecting CPU trace & flamegraph data"
        fi

  profile:gpu:
    desc: "Capture GPU frame trace with RenderDoc"
    cmds:
      - |
        if [ "{{.IN_CONTAINER}}" = "false" ]; then
          if command -v distrobox >/dev/null 2>&1 && distrobox list | grep -q "{{.DISTROBOX_NAME}}"; then
            exec distrobox enter "{{.DISTROBOX_NAME}}" -- task profile:gpu
          elif command -v docker >/dev/null 2>&1; then
            exec docker run --rm -i \
              -v "$PWD:/work" -w /work \
              -e DISPLAY=${DISPLAY:-} -v /tmp/.X11-unix:/tmp/.X11-unix \
              "{{.CONTAINER_IMAGE}}" task profile:gpu
          else
            echo "Error: No container runtime found." && exit 1
          fi
        else
          echo "[PROFILE:GPU] Capturing RenderDoc frame trace"
        fi
