# https://taskfile.dev

version: "3"

vars:
  APP_NAME: fireworks_sim
  RENDERDOC_CAP_DIR: "/tmp"
  RENDERDOC_CAP_PREFIX: "{{.RENDERDOC_CAP_DIR}}/fireworks_renderdoc"
  DISTROBOX:
    sh: 'if [ -z "$CONTAINER_ID" ] && command -v distrobox >/dev/null 2>&1 && distrobox list --no-color 2>/dev/null | grep -w "clang-dev" >/dev/null; then echo "distrobox enter clang-dev --"; else echo ""; fi'
  CARGO: '{{.DISTROBOX}} cargo'
  COVERAGE_DIR: target/llvm-cov
  XVFB:
    sh: 'if [ -z "$CONTAINER_ID" ] && command -v distrobox >/dev/null 2>&1 && distrobox list --no-color 2>/dev/null | grep -w "clang-dev" >/dev/null; then echo "distrobox enter clang-dev -- xvfb-run -a"; elif command -v xvfb-run >/dev/null 2>&1; then echo "xvfb-run -a"; else echo ""; fi'
  SKILLS_OUTPUT_DIR: '{{.HOME}}/.agents/skills'
  DOC_TEMPLATES_DIR: 'doc/ai_skills'
  VALE_BIN:
    sh: 'if command -v vale >/dev/null 2>&1; then echo "vale"; else echo "./bin/vale"; fi'
  RUN_GL: "./scripts/run_gl_smart.sh"
  RUFF:
    sh: 'if command -v ruff >/dev/null 2>&1; then echo "ruff"; elif command -v uvx >/dev/null 2>&1; then echo "uvx ruff"; elif command -v uv >/dev/null 2>&1; then echo "uv run ruff"; else echo ""; fi'

tasks:
  default:
    desc: "Cible par défaut : Lancement des tests unitaires"
    cmds:
      - task: test:all

  # =========================================
  # 🦀 DEV / DEBUG
  # =========================================
  build:debug:
    desc: "Compile le projet en mode debug (développement)"
    cmds:
      - "{{.CARGO}} build"

  run:debug:
    desc: "Exécute le projet en mode debug"
    deps: [build:debug]
    cmds:
      - "./target/debug/{{.APP_NAME}}"

  # =========================================
  # 🚀 RELEASE STANDARD
  # =========================================
  build:release:
    desc: "Compile le projet en mode release standard"
    cmds:
      - echo "⚙️  Compilation en mode release standard..."
      - "{{.CARGO}} build --release"

  run:release:
    desc: "Exécute le projet en mode release standard"
    deps: [build:release]
    cmds:
      - "./target/release/{{.APP_NAME}}"

  # =========================================
  # ⚡ ULTRA-SPEED (FPS MAX)
  # =========================================
  build:ultra-speed:
    desc: "Compile pour la VITESSE maximale (LTO fat, codegen=1)"
    cmds:
      - echo "🏎️ Compilation en mode ULTRA-SPEED..."
      - "{{.CARGO}} build --profile ultra-speed"

  run:ultra-speed:
    desc: "Exécute le projet avec les performances maximales"
    deps: [build:ultra-speed]
    cmds:
      - "./target/ultra-speed/{{.APP_NAME}}"

  run:ultra-speed-gamemode-tracy:
    desc: "Lancement en mode performance maximale absolue sous X11"
    deps: [build:ultra-speed]
    cmds:
      - echo "🏎️ Run en mode ULTRA-SPEED + MangoHud + GameModeRun + Tracy ..."
      - mangohud vblank_mode=0 mesa_glthread=true gamemoderun ./target/ultra-speed/{{.APP_NAME}}
  # =========================================
  # 📦 ULTRA-SIZE (TAILLE MIN)
  # =========================================
  build:ultra-size:
    desc: "Compile pour la TAILLE minimale (opt-level z)"
    cmds:
      - echo "🗜️ Compilation en mode ULTRA-SIZE..."
      - "{{.CARGO}} build --profile ultra-size"

  # =========================================
  # 🔬 PROFILING & DEBUG GRAPHIQUE
  # =========================================
  build:profiling:
    internal: true # Ne s'affiche pas dans `task -l`
    cmds:
      - "{{.CARGO}} build --profile profiling"

  build:profiling-native:
    desc: "Compile en mode profiling avec RUSTFLAGS natifs (AVX2 SIMD activé)"
    cmds:
      - RUSTFLAGS="-C target-cpu=native" {{.CARGO}} build --profile profiling

  asm:dsp-spatial-bus:
    desc: "Décompile la fonction DspProcessor::process_dsp_spatial_bus via GDB (avec recherche auto d'adresse)"
    deps: [build:profiling-native]
    cmds:
      - |
        ADDR=$(nm -C ./target/profiling/{{.APP_NAME}} | grep "process_dsp_spatial_bus" | awk '{print $1}')
        echo "🔍 Décompilation assembleur SIMD AVX2 de process_dsp_spatial_bus (0x$ADDR) :"
        gdb -batch -ex "file ./target/profiling/{{.APP_NAME}}" -ex "disassemble 0x$ADDR, +3500" | grep -A 22 -B 3 "vbroadcastss"

  asm:count-simd:
    desc: "Compte automatiquement les instructions SIMD AVX2 256-bit vs scalaires dans process_dsp_spatial_bus"
    deps: [build:profiling-native]
    cmds:
      - |
        ADDR=$(nm -C ./target/profiling/{{.APP_NAME}} | grep "process_dsp_spatial_bus" | awk '{print $1}')
        gdb -batch -ex "file ./target/profiling/{{.APP_NAME}}" -ex "disassemble 0x$ADDR, +3500" | awk '
        /vaddps|vmulps|vsubps|vdivps|vfmadd|vbroadcast|vmovups|vhaddps|vpermpd/ { vec++ }
        /vaddss|vmulss|vsubss|vdivss|vcmpeqss|vmaxss|vminss/ { scal++ }
        /fdiv|divss/ { div++ }
        END {
          print "--------------------------------------------------------"
          print "📊 ANALYSE ASSEMBLEUR SIMD (process_dsp_spatial_bus)"
          print "--------------------------------------------------------"
          print "⚡ Instructions Vectorielles SIMD AVX2 256-bit (ymm) :", vec+0
          print "🎯 Instructions Scalaires AVX/SSE (xmm)          :", scal+0
          print "🚫 Divisions flottantes matérielles (fdiv/divss) :", div+0
          print "--------------------------------------------------------"
        }'

  profile:valgrind-callgrind:
    desc: "Profiling avec Valgrind"
    deps: [build:profiling]
    cmds:
      - valgrind --tool=callgrind ./target/profiling/{{.APP_NAME}}
      - sh -c 'callgrind_annotate $(ls -tr | grep callgrind.out | tail -1) | grep -e "{{.APP_NAME}}::"'

  profile:heaptrack:gui:
    desc: "Profiling avec Heaptrack"
    deps: [build:profiling]
    cmds:
      - heaptrack ./target/profiling/{{.APP_NAME}}

  renderdoc:capture:
    desc: "Exécute une capture GPU RenderDoc après un délai configurable (par défaut 5s), extrait la vignette et analyse le XML"
    deps: [build:release]
    env:
      RENDERDOC_CAP_DIR: "{{.RENDERDOC_CAP_DIR}}"
      RENDERDOC_CAP_PREFIX: "{{.RENDERDOC_CAP_PREFIX}}"
    cmds:
      - "./scripts/capture_renderdoc.sh {{.CLI_ARGS}}"

  renderdoc:gui:
    desc: "Ouvre la dernière capture RenderDoc (.rdc) dans l'interface graphique qrenderdoc"
    cmds:
      - |
        RDC_FILE=$(ls -tr {{.RENDERDOC_CAP_PREFIX}}*.rdc {{.RENDERDOC_CAP_DIR}}/fireworks_*.rdc 2>/dev/null | tail -1)
        if [ -z "$RDC_FILE" ]; then
          echo "⚠️ Aucune capture .rdc trouvée. Lance d'abord : task renderdoc:capture"
          exit 1
        fi
        echo "🚀 Ouverture de $RDC_FILE dans qrenderdoc GUI..."
        exec qrenderdoc "$RDC_FILE"

  run:release-hud:
    desc: "Gallium HUD (Compatible Intel)"
    deps: [build:release]
    env:
      vblank_mode: "0"
      __GL_SYNC_TO_VBLANK: "0"
      GALLIUM_HUD_PERIOD: "0.15"
      GALLIUM_HUD: "cpu;fps;N vertices submitted"
    cmds:
      - "./target/release/{{.APP_NAME}} 2>&1"

  run:audio-stress:
    desc: "Lancement du stress test audio interactif avec Gallium HUD (VSync désactivée)"
    deps: [build:release]
    env:
      vblank_mode: "0"
      __GL_SYNC_TO_VBLANK: "0"
      RUST_LOG: "fireworks_sim=INFO"
      GALLIUM_HUD_PERIOD: "0.15"
      GALLIUM_HUD: "cpu;fps;N vertices submitted"
    cmds:
      - "./target/release/{{.APP_NAME}} --audio-stress-scene {{.CLI_ARGS | default \"128\"}}"

  test:stress-fullscreen:
    desc: "Stress test de bascule rapide Fullscreen ↔ Window (détection deadlocks / session logout)"
    deps: [build:debug]
    cmds:
      - "./scripts/test_stress_fullscreen_rust.sh ./target/debug/{{.APP_NAME}} {{.CLI_ARGS | default \"50 100\"}}"


  run:prime-hud:
    desc: "MangoHud (Compatible NVidia) Raccourci: RIGHT-SHIFT+F10"
    deps: [build:release]
    env:
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __VK_LAYER_NV_optimus: NVIDIA_onl
      vblank_mode: "0"
      __GL_SYNC_TO_VBLANK: "0"
      RUST_LOG: INFO
    cmds:
      - echo "ℹ️🖥️ Using MangoHud, press RSHIFT+F10 for chaging the HUD mode."
      - mangohud ./target/release/{{.APP_NAME}} 2>&1

  # =========================================
  # 🧪 TESTS & QUALITÉ
  # =========================================
  test:all:
    desc: "Lancement des tests unitaires"
    cmds:
      - echo "▶️  Lancement des tests unitaires..."
      - "{{.XVFB}} cargo test --all --quiet -- --test-threads=1"

  test:one:
    desc: "Lance un test unitaire (lib) spécifique avec affichage"
    cmds:
      - echo "▶️ Lancement du test ciblé '{{.CLI_ARGS}}'..."
      - "{{.XVFB}} cargo test --lib {{.CLI_ARGS}} -- --nocapture"

  test:integration:
    desc: "Lancement du test d'intégration complet (vidéo + audio)"
    deps: [build:release]
    cmds:
      - echo "▶️  Lancement du test d'intégration (capture Xvfb + ALSA)..."
      - "{{.DISTROBOX}} ./.github/scripts/test_integration.sh"

  test:coverage:
    desc: "Génération du rapport de couverture de code (résumé console + HTML)"
    cmds:
      - echo "📊 Génération du rapport de couverture (résumé console)..."
      - '{{.XVFB}} cargo llvm-cov --lib --tests --features interactive_tests --ignore-filename-regex "tests/" -- --test-threads=1'
      - '{{.XVFB}} cargo llvm-cov --lib --tests --features interactive_tests --html --output-dir {{.COVERAGE_DIR}} --ignore-filename-regex "tests/" --no-report -- --test-threads=1'
      - 'echo "✅ Rapport HTML mis à jour : {{.COVERAGE_DIR}}/index.html"'

  ci:coverage:
    desc: "CI: Run unit/integration tests with coverage under virtual framebuffer"
    cmds:
      - '{{.XVFB}} cargo llvm-cov --ignore-filename-regex "tests/" --features interactive_tests -- --test-threads=1'

  test:opengl-mesa:
    desc: "Tests OpenGL headless avec Mesa llvmpipe + debug validation (détecte les violations de spec OpenGL)"
    summary: |
      Exécute les tests interactive_tests avec le renderer logiciel Mesa (llvmpipe, OpenGL 4.5)
      et le mode debug OpenGL activé (MESA_GL_DEBUG=1).

      Les violations de spec OpenGL (ex: DeleteBuffers sur buffer mappé, états invalides)
      sont émises sur stderr via le mécanisme GL_DEBUG_OUTPUT et capturées dans un log.
      La cible échoule si des messages GL_INVALID_* ou API_ID_* sont détectés.

      Prérequis : libgl1-mesa-dri (apt install libgl1-mesa-dri)
      Voir : doc/opengl_debug_validation_guide.md
    cmds:
      - echo "🔍 Tests OpenGL headless avec Mesa llvmpipe + debug validation..."
      - |
        set -o pipefail
        {{.XVFB}} env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_DEBUG=1 GALLIUM_SOFTPIPE=1 cargo test --features interactive_tests -- --test-threads=1 2>&1 | \
        tee /tmp/mesa_gl_debug.log
      - |
        if grep -qE "GL_INVALID|error generated|API_ID_" /tmp/mesa_gl_debug.log; then
          echo "❌ Violations OpenGL détectées (voir /tmp/mesa_gl_debug.log)"
          exit 1
        fi
        echo "✅ Aucune violation OpenGL détectée"

  test:visual-full:
    desc: "Exécute le test de non-régression visuelle complet à 120 frames sur toutes les vidéos de référence"
    deps: [build:release]
    cmds:
      - echo "📹 Lancement du test de non-régression visuelle 120-frames..."
      - "{{.XVFB}} ./scripts/run_visual_regression_full.sh"

  test:fix01-visual:
    desc: "Exécute le test E2E de régression visuelle FIX-01 (GPU local / Mesa software en CI)"
    cmds:
      - echo "🎥 Test E2E régression visuelle & journalisation CSV (FIX-01)..."
      - '{{.RUN_GL}} ${CARGO_TEST_CMD:-cargo test} --features interactive_tests --test visual_regression_fix_01_erratic_vs_golden_test -- --nocapture'

  test:visual-baselines-generate:
    desc: "Génère l'ensemble du jeu de baselines vidéo & images clés candidates pour validation humaine"
    deps: [build:release]
    cmds:
      - echo "🎥 Génération des candidats de baselines visuelles..."
      - "{{.XVFB}} ./scripts/generate_golden_baselines.sh"

  lint:fmt:
    desc: "Vérification du formatage Rust & Python"
    cmds:
      - echo "🎨 Vérification du formatage Rust..."
      - "{{.CARGO}} fmt -- --check"
      - |
        if [ -n "{{.RUFF}}" ]; then
          echo "🎨 Vérification du formatage Python avec Ruff..."
          {{.RUFF}} format --check scripts/
        fi

  lint:clippy:
    desc: "Vérification statique avec Clippy"
    cmds:
      - echo "🕵️  Vérification statique avec Clippy..."
      - "{{.CARGO}} clippy -- -D warnings"

  lint:python:
    desc: "Vérification statique Python avec Ruff (via uv/ruff)"
    cmds:
      - |
        if [ -n "{{.RUFF}}" ]; then
          echo "🕵️  Vérification statique Python avec Ruff..."
          {{.RUFF}} check scripts/
        fi

  lint:all:
    desc: "Vérification complète du code (fmt + clippy + python-lint + doc-lint)"
    deps: [lint:fmt, lint:clippy, lint:python, doc:lint]

  test:gui-persistence-check:
    desc: "Vérifie que l'inventaire GUI et les cibles de persistence restent synchronisés"
    cmds:
      - "./scripts/check_gui_persistence.sh"

  hooks:install:
    desc: "Active le hook pre-commit versionné du projet"
    cmds:
      - "git config core.hooksPath .githooks"

  # =========================================
  # ⏱️ BENCHMARKS (Criterion.rs)
  # =========================================
  bench:all:
    desc: "Lance tous les benchmarks Criterion (DSP + Binaural)"
    cmds:
      - echo "⏱️  Lancement de tous les benchmarks..."
      - "{{.CARGO}} bench --no-default-features --features simd,test_helpers"

  bench:dsp:
    desc: "Benchmarks DSP audio : resample_linear_mono (upsample, downsample, identity, throughput)"
    cmds:
      - echo "⏱️  Benchmarks DSP (resample)..."
      - "{{.CARGO}} bench --no-default-features --features simd --bench audio_dsp_bench"

  bench:binaural:
    desc: "Benchmarks traitement binaural 3D : binauralize_mono (positions, distances, blocs, multi-voix)"
    cmds:
      - echo "⏱️  Benchmarks binaural 3D..."
      - "{{.CARGO}} bench --no-default-features --features simd --bench audio_binaural_bench"

  bench:spatial-bus:
    desc: "Benchmarks comparatifs du Bus Spatial 2D (Ambisonics 2D) vs rendu Legacy direct (1 à 512 voix)"
    cmds:
      - echo "⏱️  Benchmarks comparatifs Bus Spatial 2D vs Legacy..."
      - "{{.CARGO}} bench --no-default-features --features simd --bench spatial_bus_bench"

  # =========================================================================
  # 🔬 BENCHMARK & PROFILING DU POOL DE PARTICULES (FIX-04)
  # =========================================================================
  # Méthodologie :
  # 1. `task bench:pool-ops` mesure la latence d'allocation/libération avec Criterion.rs
  #    Le pool est instancié HORS de la boucle chaude via `iter_batched` pour n'isoler
  #    que le coût réel de allocate_block() et free_block_by_start().
  # 2. `task profile:pool-callgrind` génère la trace Callgrind sur le BINAIRE Criterion
  #    (pas sur le binaire GUI complet) et ouvre KCachegrind.
  # 3. `task test:tsan` valide l'absence de data races cross-threads sous ThreadSanitizer.
  #    Nécessite Rust Nightly. Cible uniquement le harness physic_pool_test.
  # =========================================================================
  bench:pool-ops:
    desc: "Micro-benchmarks Criterion isolés sur allocate_block et free_block du ParticlesPool"
    cmds:
      - echo "⏱️  Lancement des micro-benchmarks Criterion ParticlesPool..."
      - "{{.CARGO}} bench --bench physic_pool_bench"

  profile:pool-callgrind:
    desc: "Profilage Valgrind/Callgrind sur le binaire Criterion du pool physique (pas l'app GUI)"
    deps: [build:profiling]
    cmds:
      - echo "🔬 Compilation du benchmark Criterion en mode profiling..."
      - "{{.CARGO}} build --profile profiling --bench physic_pool_bench"
      - |
        BENCH_BIN=$(ls target/profiling/deps/physic_pool_bench-* | grep -v '\.d$' | head -1)
        echo "🔬 Profilage Callgrind sur $BENCH_BIN ..."
        valgrind --tool=callgrind --dump-instr=yes --collect-jumps=yes \
          --callgrind-out-file=callgrind.out.pool "$BENCH_BIN" --bench
      - kcachegrind callgrind.out.pool 2>/dev/null || callgrind_annotate callgrind.out.pool | head -n 30

  test:tsan:
    desc: "Tests du pool physique sous ThreadSanitizer (-Zsanitizer=thread). Requiert Rust Nightly."
    cmds:
      - echo "🛡️  Execution de physic_pool_test sous ThreadSanitizer (Rust Nightly requis)..."
      - RUSTFLAGS="-Zsanitizer=thread" {{.CARGO}} +nightly test -Z build-std --test physic_pool_test --target x86_64-unknown-linux-gnu

  bench:save-baseline:
    desc: "Sauvegarde une baseline de performance (usage: task bench:save-baseline -- my_baseline)"
    cmds:
      - echo "💾 Sauvegarde de la baseline '{{.CLI_ARGS}}'..."
      - "{{.CARGO}} bench --no-default-features --features simd -- --save-baseline {{.CLI_ARGS}}"

  bench:compare:
    desc: "Compare les performances contre une baseline (usage: task bench:compare -- my_baseline)"
    cmds:
      - echo "🔍 Comparaison contre la baseline '{{.CLI_ARGS}}'..."
      - "{{.CARGO}} bench --no-default-features --features simd -- --baseline {{.CLI_ARGS}}"

  bench:open-report:
    desc: "Sert le rapport Criterion via HTTP local et ouvre le navigateur (Ctrl+C pour arrêter)"
    vars:
      CRITERION_DIR: "{{.ROOT_DIR}}/target/criterion"
      PORT: "17380"
      URL: "http://localhost:17380/report/index.html"
    cmds:
      - |
        if [ ! -f "{{.CRITERION_DIR}}/report/index.html" ]; then
          echo "⚠️  Rapport non trouvé. Lance d'abord : task bench:all"
          exit 1
        fi
        echo "📊 Démarrage du serveur HTTP sur {{.URL}}"
        echo "   (Ctrl+C pour arrêter)"
        cd "{{.CRITERION_DIR}}" && python3 -m http.server {{.PORT}} &
        SERVER_PID=$!
        sleep 0.5
        xdg-open "{{.URL}}" 2>/dev/null || open "{{.URL}}" 2>/dev/null || echo "Ouvre manuellement : {{.URL}}"
        wait $SERVER_PID


  # =========================================
  # 💾 PROFILING MEMOIRE (VTUNE, HEAPTRACK)
  # =========================================
  profile:vtune:
    desc: "Run Intel VTune memory-access analysis (requires sudo permissions)"
    deps: [build:release]
    cmds:
      - ./scripts/benchmark_vtune.sh

  profile:heaptrack:cli:
    desc: "Run Heaptrack memory allocation analysis"
    deps: [build:release]
    cmds:
      - ./scripts/benchmark_heaptrack.sh

  profile:vtune-hotspots:
    desc: "Run Intel VTune CPU Hotspots analysis (Top 15 time-consuming functions)"
    deps: [build:profiling]
    cmds:
      - ./scripts/benchmark_vtune_hotspots.sh

  profile:vtune-threading:
    desc: "Run Intel VTune Threading analysis (Locks, Mutexes & Waits)"
    deps: [build:profiling]
    cmds:
      - ./scripts/benchmark_vtune_threading.sh

  # =========================================
  # 📖 DOCUMENTATION (mdBook)
  # =========================================
  doc:build:
    desc: "Compile le livre de documentation en HTML"
    cmds:
      - echo "📖 Compilation de la documentation mdBook..."
      - mdbook build

  doc:setup-vale:
    desc: "Installe Vale localement dans le projet si non présent"
    cmds:
      - |
        if ! command -v vale &>/dev/null && [ ! -f bin/vale ]; then
          echo "📥 Téléchargement de Vale CLI..."
          mkdir -p bin
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.0.0/vale_3.0.0_Linux_64-bit.tar.gz | tar -xzC bin vale
          echo "✅ Vale CLI installé dans ./bin/vale"
        fi
    status:
      - "test -f bin/vale || command -v vale"

  doc:lint:
    desc: "Vérifie les formules LaTeX et la syntaxe mathématique de la documentation avec Vale"
    deps: [doc:setup-vale]
    cmds:
      - echo "🕵️  Vérification de la syntaxe mathématique de la documentation..."
      - "find doc -maxdepth 2 -name \"*.md\" | xargs {{.VALE_BIN}}"

  doc:serve:
    desc: "Lance un serveur web local de documentation avec rechargement automatique (Ctrl+C pour arrêter)"
    vars:
      PORT: "3000"
      URL: "http://localhost:3000"
    cmds:
      - echo "📊 Démarrage du serveur mdBook sur {{.URL}}..."
      - mdbook serve --port {{.PORT}} --open

  doc:clean:
    desc: "Nettoie les fichiers de documentation compilés"
    cmds:
      - echo "🧹 Nettoyage du livre de documentation..."
      - rm -rf book/

  # =========================================
  # 🧹 MAINTENANCE
  # =========================================
  clean:all:
    desc: "Nettoyage des artefacts"
    cmds:
      - echo "🧹 Nettoyage des artefacts..."
      - "{{.CARGO}} clean"

  clean:deps:
    desc: "Exécute cargo-shear pour retirer les dépendances inutilisées"
    cmds:
      - "{{.CARGO}} shear --fix"

  # =========================================
  # 🤖 Recettes CI/CD
  # =========================================
  ci:build-docker-integration:
    desc: "CI: Build de l'image Docker avec cache inline"
    cmds:
      - docker build --build-arg USER_ID=$(id -u) --build-arg GROUP_ID=$(id -g) --build-arg BUILDKIT_INLINE_CACHE=1 -t fireworks-ci_integration -f .github/docker/Dockerfile.integration .

  ci:run-integration:
    desc: "CI: Exécution du test d'intégration Docker"
    cmds:
      - mkdir -p output
      - docker run --rm -v {{.GITHUB_WORKSPACE | default "$PWD"}}/output:/app/output fireworks-ci_integration

  ci:analyze-fireworks:
    desc: "CI: Analyse du flux optique et post-processing"
    env:
      PYTHONUNBUFFERED: "1"
    cmds:
      - echo "📈 Running Fireworks post-analysis..."
      - ffmpeg -i output/output.mp4 -vf "fps=10" output/screenshot_%04d.png
      - cd integration/visual_test && uv run main.py ../../output/ && uv run analyze_optical_flow.py ../../output ../../output --fps 6

  # =========================================
  # 📊 PROFILING AVEC TRACY
  # =========================================
  run:tracy:
    desc: "Exécute le projet avec Tracy activé (nécessite le serveur Tracy en arrière-plan)"
    deps: [build:tracy]
    env:
      RUSTFLAGS: "-C target-cpu=native" # Optimisations pour un profiling précis
    cmds:
      - echo "📊 Démarre le serveur Tracy avant de lancer cette commande !"
      - 'echo "    Exemple: tracy &"'
      - "./target/release/{{.APP_NAME}}"

  build:tracy:
    desc: "Compile avec Tracy activé"
    cmds:
      - "{{.CARGO}} build --features tracy --release"

  tracy:capture-headless:
    desc: "Exécute le simulateur en tâche de fond et capture une trace Tracy de 5s"
    cmds:
      - echo "🔨 Compilation du binaire de profiling..."
      - "{{.CARGO}} build --features tracy --release"
      - echo "🚀 Lancement du simulateur en tâche de fond et capture Tracy (5s)..."
      - |
        bash -c '
          vblank_mode=0 __GL_SYNC_TO_VBLANK=0 ./scripts/run_gl_smart.sh ./target/release/fireworks_sim > /tmp/sim.log 2>&1 &
          SIM_PID=$!
          sleep 2
          echo "📊 Lancement de la capture Tracy (5s)..."
          TRACY_CAP="${TRACY_CAPTURE_BIN:-$(command -v tracy-capture 2>/dev/null || echo /usr/local/bin/tracy-capture)}"
          "$TRACY_CAP" -f -o /tmp/fireworks.tracy -s 5
          echo "🧹 Arrêt du simulateur..."
          kill $SIM_PID 2>/dev/null || true
          sleep 0.2
          kill -9 $SIM_PID 2>/dev/null || true
          wait $SIM_PID 2>/dev/null || true
        '

  bench:tracy-ratios:
    desc: "Capture une trace Tracy et audite la dérive des ratios relatifs de temps de rendu par rapport à la baseline develop"
    deps: [tracy:capture-headless]
    cmds:
      - ./scripts/analyze_tracy_ratios.sh /tmp/fireworks.tracy benches/baselines/tracy_ratios_develop.csv compare

  tracy:generate-baseline:
    desc: "Génère la baseline de référence des ratios Tracy (benches/baselines/tracy_ratios_develop.csv)"
    deps: [tracy:capture-headless]
    cmds:
      - ./scripts/analyze_tracy_ratios.sh /tmp/fireworks.tracy benches/baselines/tracy_ratios_develop.csv generate

  profile:tracy-headless:
    desc: "Exécute le projet sous profilage Tracy en tâche de fond, enregistre une trace headless de 5s, et extrait les statistiques de render_frame en CSV"
    deps: [tracy:capture-headless]
    cmds:
      - echo "📊 Extraction des statistiques de Renderer::render_frame..."
      - |
        TRACY_CSV="${TRACY_CSVEXPORT_BIN:-{{.HOME}}/Prog/__PERSO__/suckless-ogl/deps/tracy/csvexport/build/tracy-csvexport}"
        "$TRACY_CSV" -u -f 'Renderer::render_frame' /tmp/fireworks.tracy > /tmp/durations.csv
      - echo "📈 Statistiques de Renderer::render_frame (hors warmup) :"
      - |
        python3 -c "
        import csv
        durations = []
        with open('/tmp/durations.csv', 'r') as f:
            reader = csv.DictReader(f)
            for row in reader:
                durations.append(int(row['exec_time_ns']))
        warm_durations = durations[5:] if len(durations) > 5 else durations
        print(f'   - Nombre total de frames analysées : {len(warm_durations)}')
        print(f'   - Durée moyenne (Mean)             : {sum(warm_durations)/len(warm_durations)/1000:.2f} us')
        print(f'   - Durée médiane (Median)           : {sorted(warm_durations)[len(warm_durations)//2]/1000:.2f} us')
        print(f'   - Durée minimale (Min)             : {min(warm_durations)/1000:.2f} us')
        print(f'   - Durée maximale (Max)             : {max(warm_durations)/1000:.2f} us')
        "

  # =========================================
  # 🎧 PROFILING PERF + HOTSPOT (AUDIO DOPPLER)
  # =========================================
  build:perf:
      desc: "Compile avec les symboles et Frame Pointers pour Linux perf"
      env:
        RUSTFLAGS: "-C force-frame-pointers=yes" # Compatible Cargo stable !
      cmds:
        - echo "🛠️ Compilation du profil Perf-Friendly..."
        - "{{.CARGO}} build --profile perf"

  assets:preprocess:
    desc: "Pré-calcule les textures PNG en binaire brut (.raw_tex). Peut cibler un fichier (usage: task assets:preprocess -- <fichier.png>)"
    cmds:
      - echo "🖼️  Génération des fichiers .raw_tex depuis les .png..."
      - python3 scripts/preprocess_textures.py {{.CLI_ARGS}}

  profile:record-perf-audio:
    desc: "Enregistre 10s de stress-test audio pur avec perf (sans rendu graphique)"
    deps: [build:perf]
    vars:
      PERF_DATA: "target/perf_audio_doppler.data"
    cmds:
      - echo "🎙️ Enregistrement haute fréquence (997 Hz) du moteur audio..."
      # -F 997 : fréquence d'échantillonnage prime pour éviter les résonances avec les boucles
      # --call-graph fp : utilise les Frame Pointers (ultra léger et précis grâce au profil Cargo)
      # --sample-cpu : enregistre sur quel cœur CPU le thread tourne (visible dans Hotspot)
      - perf record -F 997 --call-graph fp --sample-cpu -o {{.PERF_DATA}} ./target/perf/{{.APP_NAME}} --headless-audio-stress 10

  profile:hotspot-audio:
      desc: "Ouvre l'enregistrement audio directement dans l'interface graphique Hotspot"
      vars:
        PERF_DATA: "target/perf_audio_doppler.data"
      cmds:
        - |
          if [ ! -f "{{.PERF_DATA}}" ]; then
            echo "⚠️ Aucun fichier perf.data trouvé ! Lancement de l'enregistrement..."
            task profile:record-perf-audio
          fi
        - echo "🚀 Lancement de Hotspot GUI..."
        # Lancement au PREMIER PLAN sans masquer les erreurs.
        # Si l'AppImage échoue à cause de FUSE, tu verras immédiatement l'erreur dans le terminal !
        - hotspot {{.PERF_DATA}}

  # =========================================
  # 🧠 IA + Skills
  # =========================================
  ai:update-skills:
      desc: 'Régénère et configure toutes les compétences IA locales pour Antigravity / agy'
      summary: |
        Analyse la codebase avec Repomix par sous-système (Audio, Renderer, Physic, ImGui),
        génère le contexte d'indexation dans ~/.agents/skills/, puis applique automatiquement
        les overlays personnalisés (SKILL.md) depuis le dossier doc/ai_skills/.
      cmds:
        - task: _ai:generate-overlay-skill
          vars:
            NAME: 'firework-audio'
            INCLUDE: 'src/audio_engine/**,doc/*audio*,doc/*doppler*'
        - task: _ai:generate-overlay-skill
          vars:
            NAME: 'firework-renderer'
            INCLUDE: 'src/renderer_engine/**,assets/shaders/**,doc/*azdo*,doc/*opengl*,doc/*tracy*,doc/*gpu*'
        - task: _ai:generate-overlay-skill
          vars:
            NAME: 'firework-physic'
            INCLUDE: 'src/physic_engine/**,src/simulator.rs,doc/*physic*,doc/*memory*'
        - task: _ai:generate-overlay-skill
          vars:
            NAME: 'firework-imgui'
            INCLUDE: 'src/window_engine/**,src/utils/command_console.rs,src/utils/glfw_window.rs,src/profiler.rs,src/renderer_engine/tools.rs,doc/console_commands.md,doc/*profiling*'
        - echo "✨ Tout est prêt ! Les compétences IA sont à jour et patchées dans {{.SKILLS_OUTPUT_DIR}}."
      silent: false

  # Tâche interne (masquée du CLI 'task --list') qui sert de template réutilisable (DRY)
  _ai:generate-overlay-skill:
    internal: true
    desc: 'Tâche template : Génère un skill spécifique via Repomix et écrase son SKILL.md'
    cmds:
      - echo "🤖 [{{.NAME}}] Génération du contexte Repomix..."
      - npx -y repomix@latest --include "{{.INCLUDE}}" --skill-generate {{.NAME}} --skill-output {{.SKILLS_OUTPUT_DIR}}/{{.NAME}} --force
      - |
        if [ -f "{{.DOC_TEMPLATES_DIR}}/{{.NAME}}.md" ]; then
          cp -f "{{.DOC_TEMPLATES_DIR}}/{{.NAME}}.md" "{{.SKILLS_OUTPUT_DIR}}/{{.NAME}}/SKILL.md"
          echo "  ✔ Overlay appliqué avec succès : {{.DOC_TEMPLATES_DIR}}/{{.NAME}}.md -> SKILL.md"
        else
          echo "  ⚠️ Attention : Aucun fichier template trouvé dans {{.DOC_TEMPLATES_DIR}}/{{.NAME}}.md (SKILL.md par défaut conservé)"
        fi
      - echo ""
    silent: true

  # =========================================
  # 🐳 DEVOPS & LOCAL ISO CONTAINER RUNNER
  # =========================================
  devops:build-image:
    desc: "Builds the Golden CI Docker Image locally using Docker or Podman"
    vars:
      IMAGE_NAME: 'ghcr.io/yoyonel/rust-firework-ci:latest'
    cmds:
      - |
        RUNTIME=$(command -v podman || command -v docker)
        if [ -z "$RUNTIME" ]; then
          echo "❌ Neither podman nor docker found on host system."
          exit 1
        fi
        echo "🔨 Building Golden Image with $RUNTIME ($IMAGE_NAME)..."
        $RUNTIME build -t "{{.IMAGE_NAME}}" -f .github/docker/Dockerfile.ci .

  devops:run:
    desc: "Executes a Task command inside the ISO Golden Container (Usage: task devops:run -- task lint:all)"
    vars:
      IMAGE_NAME: 'ghcr.io/yoyonel/rust-firework-ci:latest'
      CMD: '{{.CLI_ARGS | default "task test:opengl-mesa"}}'
    cmds:
      - |
        if command -v podman >/dev/null 2>&1; then
          RUNTIME="podman"
          USER_FLAGS="--user 0:0"
        elif command -v docker >/dev/null 2>&1; then
          RUNTIME="docker"
          USER_FLAGS="--user $(id -u):$(id -g)"
        else
          echo "❌ Neither podman nor docker found."
          exit 1
        fi
        DRI_FLAGS=""
        if [ -e /dev/dri ]; then
          DRI_FLAGS="--device /dev/dri:/dev/dri:rw"
        fi
        mkdir -p "${HOME}/.cargo/registry" "${HOME}/.cargo/git" "${HOME}/.cache/sccache"
        echo "🐳 Running in Golden Image ($RUNTIME): {{.CMD}}"
        $RUNTIME run --rm \
          $USER_FLAGS \
          $DRI_FLAGS \
          -e DISPLAY="${DISPLAY:-:99}" \
          -v /tmp/.X11-unix:/tmp/.X11-unix:rw \
          -v "${HOME}/.cargo/registry:/usr/local/cargo/registry:rw" \
          -v "${HOME}/.cargo/git:/usr/local/cargo/git:rw" \
          -v "${HOME}/.cache/sccache:/tmp/sccache_cache:rw" \
          -v "$PWD:/workspace:rw" \
          -w /workspace \
          "{{.IMAGE_NAME}}" \
          {{.CMD}}

  devops:shell:
    desc: "Spawns an interactive bash shell inside the ISO Golden Container for local debugging"
    vars:
      IMAGE_NAME: 'ghcr.io/yoyonel/rust-firework-ci:latest'
    cmds:
      - task: devops:run
        vars:
          CLI_ARGS: "bash"

  devops:lint:
    desc: "Executes the linting pipeline (task lint:all) inside the ISO Golden Container"
    cmds:
      - task: devops:run
        vars:
          CLI_ARGS: "task lint:all"

  devops:test:
    desc: "Executes the test pipeline (task test:opengl-mesa) inside the ISO Golden Container"
    cmds:
      - task: devops:run
        vars:
          CLI_ARGS: "task test:opengl-mesa"

  devops:audit:
    desc: "Executes cargo deny check for vulnerabilities and licenses inside the ISO Golden Container"
    cmds:
      - task: devops:run
        vars:
          CLI_ARGS: "cargo deny check advisories licenses bans"

