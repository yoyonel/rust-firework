---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gui-persistence-check
        name: GUI Persistence Inventory Check
        entry: bash scripts/check_gui_persistence.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-fmt
        name: Rust Format (cargo fmt)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: Rust Clippy (cargo clippy)
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test
        name: Cargo Test Unit Suite
        entry: cargo test --lib --tests
        language: system
        pass_filenames: false
        stages: [pre-push]
